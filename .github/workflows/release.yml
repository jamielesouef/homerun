name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build arm64
        run: swift build -c release --arch arm64

      - name: Build x86_64
        run: swift build -c release --arch x86_64

      - name: Create universal binary
        run: |
          mkdir -p dist
          lipo -create -output dist/homerun \
            .build/arm64-apple-macosx/release/homerun \
            .build/x86_64-apple-macosx/release/homerun
          chmod +x dist/homerun
          lipo -info dist/homerun

      - name: Zip
        run: |
          cd dist
          zip "homerun-${{ github.ref_name }}-macos.zip" homerun

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "dist/homerun-${{ github.ref_name }}-macos.zip" \
            --title "${{ github.ref_name }}" \
            --generate-notes
