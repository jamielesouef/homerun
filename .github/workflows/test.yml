name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-27
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.app
      - name: Run tests
        working-directory: cli
        run: swift test

  lint:
    runs-on: macos-27
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint and SwiftFormat
        run: brew install swiftlint swiftformat
      - name: SwiftFormat
        run: swiftformat --lint .
      - name: SwiftLint
        run: swiftlint lint --strict
